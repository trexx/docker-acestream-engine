name: 'Release'

# Release button: Actions -> Release -> Run workflow. Tags Ace Stream's version and Python build: 3.2.11_ubuntu_18.04_x86_64_py3.8 is 3.2.11-py3.8
# (or <version>-N for a rebuild of a version released before), builds and pushes the
# image, then creates the tag and GitHub release. Tick "dry run" to see the tag first.

on:
  workflow_dispatch:
    inputs:
      tag:
        description: 'Tag to release (leave empty to work it out from the Dockerfile)'
        required: false
        default: ''
      dry_run:
        description: 'Dry run: only work out the tag and build the image'
        type: boolean
        default: false

jobs:
  release:
    uses: 'trexx/actions/.github/workflows/release-image.yml@main'
    permissions:
      contents: 'write'
      packages: 'write'
    with:
      version_command: >-
        sed -n 's/^ENV ACE_STREAM_VERSION="\([0-9.]*\)_.*_\(py[0-9.]*\)"/\1-\2/p' Dockerfile
      tag: '${{ inputs.tag }}'
      dry_run: ${{ inputs.dry_run }}
      # The package keeps older versions, as the tag-triggered build does.
      prune_images: false
